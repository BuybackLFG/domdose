# Подключается в http-контекст официального образа как conf.d/default.conf.
# execution.log в volume frontend_logs: access-строки в маркированном формате
# [TIMESTAMP] [LEVEL] [frontend] [MARKER] message | data={...}; error-строки
# nginx пишет в своём штатном формате (его формат не настраивается).

# Путь без query: query в журнал не попадает.
map $request_uri $execution_path {
    "~^(?<path>[^?]*)" $path;
    default            "";
}

map $status $execution_level {
    "~^5"   ERROR;
    "~^4"   WARNING;
    default INFO;
}

# Успешные проверки healthcheck изнутри контейнера не засоряют журнал; их отказ пишется.
map "$remote_addr:$status" $execution_loggable {
    "~^127\.0\.0\.1:[23]" 0;
    default               1;
}

log_format execution escape=json
    '[$time_iso8601] [$execution_level] [frontend] [HTTP_REQUEST] request completed | '
    'data={"service":"frontend","request_id":"$request_id","method":"$request_method",'
    '"path":"$execution_path","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status"}';

error_log /var/log/domdossier/execution.log warn;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    access_log /var/log/domdossier/execution.log execution if=$execution_loggable;
    access_log /dev/stdout execution if=$execution_loggable;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Заголовки задаются только здесь: add_header внутри вложенного блока отменил бы
    # их наследование, поэтому кэширование ниже управляется директивой expires.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Liveness: процесс nginx отвечает.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Readiness: SPA и обязательные локальные offline-assets карты на месте.
    location = /ready {
        default_type application/json;
        if (!-f $document_root/index.html) {
            return 503 '{"status":"not_ready","reason":"index_missing"}';
        }
        if (!-f $document_root/maps/vladivostok-pilot.png) {
            return 503 '{"status":"not_ready","reason":"map_image_missing"}';
        }
        if (!-f $document_root/maps/vladivostok-pilot.manifest.json) {
            return 503 '{"status":"not_ready","reason":"map_manifest_missing"}';
        }
        return 200 '{"status":"ready"}';
    }

    # Единственный backend браузера; адрес api разрешается в сети Docker.
    location /api/ {
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Хэшированные файлы Vite: долгий кэш; отсутствующий файл — 404, а не index.html.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /maps/ {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
