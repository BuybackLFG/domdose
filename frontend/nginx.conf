# Подключается в http-контекст официального образа как conf.d/default.conf.
# execution.log в volume frontend_logs: access-строки в маркированном формате
# [TIMESTAMP] [LEVEL] [frontend] [MARKER] message | data={...}; error-строки
# nginx пишет в своём штатном формате (его формат не настраивается).

# DNS сети Docker: имя api переразрешается в runtime, поэтому пересоздание
# контейнера api не требует перезапуска frontend, а старт frontend не требует
# разрешимого api (до разрешения upstream отвечает 502).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve;
}

# Путь без query: в access-строки query не попадает.
map $request_uri $execution_path {
    "~^(?<path>[^?]*)" $path;
    default            "";
}

map $status $execution_level {
    "~^5"   ERROR;
    "~^4"   WARNING;
    default INFO;
}

# Успешные проверки healthcheck изнутри контейнера не засоряют журнал; их отказ пишется.
map "$remote_addr:$status" $execution_loggable {
    "~^127\.0\.0\.1:[23]" 0;
    default               1;
}

# Причина отказа ворот данных (только после auth_request /_gate): пусто — ворота
# пропустили; иначе код api из X-DomDossier-Error либо api_unavailable, если api
# не ответил кодом (не разрешён, недоступен, ответ без заголовка).
map "$gate_status|$gate_error" $gate_reason {
    "~(?:^|\s)2\d\d\|"           "";
    "~\|(?<code>[a-z_]{1,64})$" $code;
    default                      api_unavailable;
}

log_format execution escape=json
    '[$time_iso8601] [$execution_level] [frontend] [HTTP_REQUEST] request completed | '
    'data={"service":"frontend","request_id":"$request_id","method":"$request_method",'
    '"path":"$execution_path","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"error_code":"$sent_http_x_domdossier_error"}';

# Уровень crit: штатные отказы запросов (api недоступен, отказ ворот) error-строками
# не пишутся — каждый виден в access-строке (status, upstream_status, error_code)
# без query. Строки crit/alert/emerg (сбой конфигурации или ресурсов ОС) остаются
# в штатном формате nginx и могут содержать строку запроса вместе с query.
error_log /var/log/domdossier/execution.log crit;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    access_log /var/log/domdossier/execution.log execution if=$execution_loggable;
    access_log /dev/stdout execution if=$execution_loggable;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Заголовки безопасности задаются здесь; вложенные блоки с собственным add_header
    # обязаны объявлять add_header_inherit merge, иначе наследование отменяется.
    # Кэширование ниже управляется директивой expires.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Итог ворот данных для блоков с auth_request /_gate.
    auth_request_set $gate_status $upstream_status;
    auth_request_set $gate_error $upstream_http_x_domdossier_error;

    # Liveness: процесс nginx отвечает; api не требуется.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Readiness: SPA и обязательные offline-assets карты на месте, api готов.
    location = /ready {
        default_type application/json;
        if (!-f $document_root/index.html) {
            return 503 '{"status":"not_ready","reason":"index_missing"}';
        }
        if (!-f $document_root/maps/vladivostok-pilot.png) {
            return 503 '{"status":"not_ready","reason":"map_image_missing"}';
        }
        if (!-f $document_root/maps/vladivostok-pilot-detail.png) {
            return 503 '{"status":"not_ready","reason":"map_detail_image_missing"}';
        }
        if (!-f $document_root/maps/vladivostok-pilot.manifest.json) {
            return 503 '{"status":"not_ready","reason":"map_manifest_missing"}';
        }
        auth_request /_gate;
        error_page 500 = @not_ready;
        # return выполняется до проверки доступа, поэтому ответ готовности
        # отдаёт именованный блок после ворот: файла-маркера в dist нет.
        try_files /nonexistent-ready-marker @ready;
    }

    location @ready {
        default_type application/json;
        return 200 '{"status":"ready"}';
    }

    location @not_ready {
        # Ворота пропустили: 500 не связан с готовностью api и остаётся 500.
        if ($gate_reason = "") {
            return 500;
        }
        add_header_inherit merge;
        add_header X-DomDossier-Error $gate_reason always;
        default_type application/json;
        return 503 '{"status":"not_ready","reason":"$gate_reason"}';
    }

    # Ворота документов SPA: готовность api /api/ready через тот же upstream.
    # Только подзапрос auth_request; тело и query клиента в api не уходят.
    location = /_gate {
        internal;
        proxy_pass http://api_backend/api/ready;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_http_version 1.1;

        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Отказ ворот: auth_request превращает не-2xx ответ api в 500, здесь — 503
    # с кодом причины; короткая страница без SPA (нет #root и бандла).
    location @data_unavailable {
        if ($gate_reason = "") {
            return 500;
        }
        add_header_inherit merge;
        add_header X-DomDossier-Error $gate_reason always;
        add_header Cache-Control "no-store" always;
        # Тип по расширению (/index.html) или default_type; charset дописывает utf-8.
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Данные недоступны</title></head><body><h1>Данные недоступны</h1><p>Код причины: $gate_reason</p></body></html>';
    }

    # Единственный backend браузера; scoring отсюда недоступен.
    location /api/ {
        proxy_pass http://api_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Хэшированные файлы Vite и карта не закрыты воротами: без документа SPA
    # они бесполезны и данных досье не содержат. Отсутствующий файл — 404.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /maps/ {
        expires -1;
        try_files $uri =404;
    }

    # Документы SPA закрыты воротами данных; файл отдаётся без внутренних
    # перенаправлений, чтобы ворота проверялись один раз.
    location = / {
        auth_request /_gate;
        error_page 500 = @data_unavailable;
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        auth_request /_gate;
        error_page 500 = @data_unavailable;
        expires -1;
    }

    location / {
        auth_request /_gate;
        error_page 500 = @data_unavailable;
        expires -1;
        try_files $uri /index.html =404;
    }
}
