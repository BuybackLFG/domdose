server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    log_format execution escape=json
        '[$time_iso8601] [INFO] [frontend] [HTTP_REQUEST] request completed | '
        'data={"method":"$request_method","uri":"$uri","status":$status,'
        '"request_time":$request_time}';
    access_log /logs/execution.log execution;
    error_log /logs/execution.log warn;

    # Liveness: сам frontend смонтирован и способен ответить без backend.
    location = /health {
        default_type application/json;
        if (!-f /usr/share/nginx/html/index.html) {
            return 503;
        }
        return 200 '{"status":"ok"}';
    }

    # Readiness: обязательные локальные offline-assets доступны.
    location = /ready {
        default_type application/json;
        if (!-f /usr/share/nginx/html/index.html) {
            return 503;
        }
        if (!-f /usr/share/nginx/html/maps/vladivostok-pilot.png) {
            return 503;
        }
        if (!-f /usr/share/nginx/html/maps/vladivostok-pilot.manifest.json) {
            return 503;
        }
        return 200 '{"status":"ready"}';
    }

    # Backend доступен только внутри Docker network; браузер ходит через тот же origin.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location /maps/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Файловый журнал монтируется в named volume и не публикуется по HTTP.
    location ^~ /logs/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
